# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Reference: https://github.com/microsoft/PowerToys/blob/main/doc/devdocs/readme.md#compiling-powertoys
properties:
  configurationVersion: 0.2.0
  resources:

# Windows settings
    - resource: Microsoft.Windows.Developer/WindowsExplorer
      directives:
        description: File Explorer settings 
        allowPrerelease: true
      settings:
        FileExtensions: Show
        HiddenFiles: Show
    - resource: Microsoft.Windows.Developer/Taskbar
      directives:
        description: Taskbar settings 
        allowPrerelease: true
      settings:
        SearchboxMode: Hide
        TaskViewButton: Hide
        WidgetsButton: Hide

    - resource: PSDscResources/Script
      id: Win.BlackArrowCursor
      directives:
        description: Black Aero arrow mouse pointer (all other pointers stay standard Aero)
        allowPrerelease: true
      settings:
        GetScript: |
          $arrow = (Get-ItemProperty -LiteralPath 'HKCU:\Control Panel\Cursors' -Name Arrow -ErrorAction SilentlyContinue).Arrow
          return @{ Result = "$arrow" }
        TestScript: |
          $expected = Join-Path $env:LOCALAPPDATA 'CustomCursors\AeroBlack\aero_arrow.cur'
          $arrow = (Get-ItemProperty -LiteralPath 'HKCU:\Control Panel\Cursors' -Name Arrow -ErrorAction SilentlyContinue).Arrow
          return ($arrow -eq $expected) -and (Test-Path -LiteralPath $expected)
        SetScript: |
          $uri = 'https://raw.githubusercontent.com/crutkas/setup/main/scripts/Set-BlackArrowCursor.ps1'
          $path = Join-Path $env:TEMP "Set-BlackArrowCursor-$([guid]::NewGuid().ToString('N')).ps1"

          try {
              Invoke-WebRequest -Uri $uri -OutFile $path -UseBasicParsing

              & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
                  -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                  -File $path

              if ($LASTEXITCODE -ne 0) {
                  throw "Black arrow cursor setup failed with exit code $LASTEXITCODE."
              }
          }
          finally {
              Remove-Item $path -Force -ErrorAction SilentlyContinue
          }

    - resource: PSDscResources/Script
      id: Win.StoreUpdate
      directives:
        description: Updating Store Apps, we care mostly about Terminal and App installer
        allowPrerelease: true
      settings:
        GetScript: |
          return @{ Result = 'Always checked during configuration' }
        TestScript: |
          return $false
        SetScript: |
          $uri = 'https://raw.githubusercontent.com/crutkas/setup/main/scripts/Update-MicrosoftStoreApps.ps1'
          $path = Join-Path $env:TEMP "Update-MicrosoftStoreApps-$([guid]::NewGuid().ToString('N')).ps1"

          try {
              Invoke-WebRequest -Uri $uri -OutFile $path -UseBasicParsing

              & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
                  -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                  -File $path -ThrottleLimit 4

              if ($LASTEXITCODE -ne 0) {
                  throw "Store updates failed with exit code $LASTEXITCODE."
              }
          }
          finally {
              Remove-Item $path -Force -ErrorAction SilentlyContinue
          }

    - resource: PSDscResources/Script
      id: Win.UpdateWindows
      directives:
        description: Updating Windows
        allowPrerelease: true
      settings:
        GetScript: |
          return @{ Result = 'Always checked during configuration' }
        TestScript: |
          return $false
        SetScript: |
          $uri = 'https://raw.githubusercontent.com/crutkas/setup/main/scripts/Update-Windows.ps1'
          $path = Join-Path $env:TEMP "Update-Windows-$([guid]::NewGuid().ToString('N')).ps1"

          try {
              Invoke-WebRequest -Uri $uri -OutFile $path -UseBasicParsing

              & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
                  -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                  -File $path

              # 3010 means updates installed successfully but a restart is
              # required to finish. Treat that as success, not failure.
              if ($LASTEXITCODE -eq 3010) {
                  Write-Host 'Windows Update installed updates; a restart is required to finish.'
              }
              elseif ($LASTEXITCODE -ne 0) {
                  throw "Windows Update failed with exit code $LASTEXITCODE."
              }
          }
          finally {
              Remove-Item $path -Force -ErrorAction SilentlyContinue
          }
